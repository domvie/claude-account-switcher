name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    # macOS only: src-tauri/src/platform/{windows,linux}.rs are still stubs, so
    # shipping those bundles would hand users an app that cannot launch anything.
    # CI keeps cargo-checking all three platforms; add them back here once the
    # platform layer is actually implemented.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Claude Account Switcher ${{ github.ref_name }}"
          releaseBody: |
            **macOS only.** Windows and Linux are not implemented yet — the app
            builds on those platforms, but launching Claude/Codex is stubbed out,
            so no bundles are published for them.

            The macOS build is a universal binary and is **unsigned** (no paid
            developer certificate), so Gatekeeper will object once. Either
            right-click the app and choose **Open**, use System Settings →
            Privacy & Security → **"Open Anyway"** after the first blocked
            launch, or run:

            ```sh
            xattr -cr "/Applications/Claude Account Switcher.app"
            ```

            See the README for how profile isolation works and for known quirks.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}
