version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    groups:
      tauri-js:
        patterns: ["@tauri-apps/*"]
      dev-tooling:
        dependency-type: development
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: monthly
    groups:
      tauri-rust:
        patterns: ["tauri", "tauri-build", "tauri-plugin-*"]
      rust-deps:
        patterns: ["*"]
